  /* ---------- download + image helpers ---------- */
  function dl(blob, name){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  }
  async function thumb(id, max){            // → {blob, w, h} (JPEG)
    const b = await dbGet(id);
    if (!b) return null;
    const u = URL.createObjectURL(b);
    const img = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = u; });
    if (!img){ URL.revokeObjectURL(u); return null; }
    const r = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.width*r)); c.height = Math.max(1, Math.round(img.height*r));
    const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height);
    x.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
    return {blob, w:c.width, h:c.height};
  }

  /* ---------- minimal ZIP writer (no compression) for xlsx / docx ---------- */
  const CRC = (() => { const tt = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; tt[n]=c>>>0; } return tt; })();
  const crc32 = u => { let c = 0xFFFFFFFF; for (let i=0;i<u.length;i++) c = CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  function makeZip(files, mime){
    const enc = new TextEncoder(), parts = [], cen = [];
    const u16 = n => [n&255,(n>>8)&255], u32 = n => [n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
    let off = 0;
    files.forEach(f => {
      const nm = enc.encode(f.name), d = typeof f.data === "string" ? enc.encode(f.data) : f.data, c = crc32(d);
      const lh = new Uint8Array([0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
        ...u32(c), ...u32(d.length), ...u32(d.length), ...u16(nm.length), ...u16(0)]);
      parts.push(lh, nm, d);
      cen.push(new Uint8Array([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
        ...u32(c), ...u32(d.length), ...u32(d.length), ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
        ...u32(0), ...u32(off)]), nm);
      off += lh.length + nm.length + d.length;
    });
    let cs = 0; cen.forEach(p => cs += p.length);
    const end = new Uint8Array([0x50,0x4b,5,6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length),
      ...u32(cs), ...u32(off), ...u16(0)]);
    return new Blob([...parts, ...cen, end], {type:mime});
  }
  const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';

  /* ---------- Excel (.xlsx) ---------- */
  function xlsxStyles(){
    const bd = '<border><left style="thin"><color rgb="FFB9C8EA"/></left><right style="thin"><color rgb="FFB9C8EA"/></right><top style="thin"><color rgb="FFB9C8EA"/></top><bottom style="thin"><color rgb="FFB9C8EA"/></bottom><diagonal/></border>';
    const fill = c => `<fill><patternFill patternType="solid"><fgColor rgb="FF${c}"/><bgColor indexed="64"/></patternFill></fill>`;
    return XML + `<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="1"><numFmt numFmtId="164" formatCode="0.00"/></numFmts>
<fonts count="5"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="16"/><color rgb="FF1F3A7A"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><i/><sz val="10"/><color rgb="FF6D7FA6"/><name val="Calibri"/></font></fonts>
<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fill("4A80E8")}${fill("E8EEFB")}</fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${bd}</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="11">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"><alignment vertical="center"/></xf>
<xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>
<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>
<xf numFmtId="0" fontId="3" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>
<xf numFmtId="164" fontId="3" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="0" fontId="3" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>
<xf numFmtId="1" fontId="3" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
</cellXfs></styleSheet>`;
  }
  /* wraps one worksheet into an .xlsx file; extra = pictures (drawing, media, relationships) */
  function xlsxZip(sheet, extraFiles = [], extraTypes = ""){
    return makeZip([
      {name:"[Content_Types].xml", data: XML + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' + extraTypes + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
      {name:"_rels/.rels", data: XML + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
      {name:"xl/workbook.xml", data: XML + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Report" sheetId="1" r:id="rId1"/></sheets></workbook>'},
      {name:"xl/_rels/workbook.xml.rels", data: XML + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
      {name:"xl/styles.xml", data: xlsxStyles()},
      {name:"xl/worksheets/sheet1.xml", data: sheet},
      ...extraFiles
    ], "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  }

  function xlsxBlob(D){
    const out = [], merges = [];
    let r = 1, widths, ncol;
    const cell = (c, v, s) => typeof v === "number"
      ? `<c r="${colName(c)}${r}" s="${s}"><v>${v}</v></c>`
      : `<c r="${colName(c)}${r}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
    const row = (cells, ht) => { out.push(`<row r="${r}"${ht ? ` ht="${ht}" customHeight="1"` : ""}>${cells.map((x,i) => cell(i, x[0], x[1])).join("")}</row>`); r++; };
    const merge = () => merges.push(`A${r-1}:${colName(ncol-1)}${r-1}`);
    const blank = (n, s = 1) => Array.from({length:n}, () => ["", s]);

    if (D.kind === "motors"){
      ncol = 2 + D.cols.length;
      widths = [6, 22, ...D.cols.map(c => c.k.length > 14 ? 22 : 16)];
      row([[D.title,1], ...blank(ncol - 1)], 28); merge();
      row([[D.sub + "  ·  " + D.date,7], ...blank(ncol - 1, 7)]); merge();
      r++;
      row([["#",2],[t("thMotor"),2], ...D.cols.map(c => [c.label,2])], 22);
      D.groups.forEach(g => {
        row([["🗄 " + g.name + (g.loc ? "  –  " + g.loc : ""),8], ...blank(ncol - 1, 8)], 20); merge();
        g.rows.forEach(x => row([[x.i,9],[x.name,3], ...x.vals.map(v => [v,3])]));
      });
      row([[D.total.count,10],[t("totalMotors"),5],
           ...D.cols.map(c => c.tot === "kw" ? [D.total.kw,6] : c.tot === "a" ? [D.total.a,6] : ["",5])], 22);
    } else {
      ncol = 5; widths = [16,24,28,36,14];
      row([[D.title,1], ...blank(4)], 28); merge();
      row([[D.sub + "  ·  " + D.date,7], ...blank(4, 7)]); merge();
      r++;
      row([[t("thMotor"),2],[t("tEquip"),2],[t("thParam"),2],[t("thValue"),2],[t("xPhotos"),2]], 22);
      D.motors.forEach(m => {
        row([[m.name,8], ...blank(4, 8)], 20); merge();
        if (!m.equip.length) row([["",3],[t("noEquipReg"),3],["",3],["",3],["",3]]);
        m.equip.forEach(q => {
          const lines = [];
          if (q.desc) lines.push([t("desc"), q.desc]);
          q.specs.forEach(s => lines.push(s));
          if (!lines.length) lines.push(["—","—"]);
          lines.forEach((ln,i) => row([["",3],[i===0 ? q.name : "",3],[ln[0],3],[ln[1],3],[i===0 ? q.photos.length : "", i===0 ? 9 : 3]]));
        });
      });
    }
    const orient = D.kind === "motors" ? "landscape" : "portrait";
    const sheet = XML + `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView${isRTL() ? ' rightToLeft="1"' : ""} showGridLines="0" workbookViewId="0"/></sheetViews><cols>${widths.map((w,i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${out.join("")}</sheetData><mergeCells count="${merges.length}">${merges.map(m => `<mergeCell ref="${m}"/>`).join("")}</mergeCells><pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="${orient}" fitToWidth="1" fitToHeight="0"/></worksheet>`;
    return xlsxZip(sheet);
  }

  /* Excel photo report: the photos themselves are embedded in the sheet */
  async function xlsxPhotosBlob(D){
    const out = [], merges = [], pics = [];
    let r = 1, n = 0;
    const cell = (c, v, s) => {
      const ref = "AB"[c] + r;
      return typeof v === "number"
        ? `<c r="${ref}" s="${s}"><v>${v}</v></c>`
        : `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
    };
    const row = (cells, ht) => { out.push(`<row r="${r}"${ht ? ` ht="${ht}" customHeight="1"` : ""}>${cells.map((x,i) => cell(i, x[0], x[1])).join("")}</row>`); r++; };
    const merge = () => merges.push(`A${r-1}:B${r-1}`);

    row([[D.title,1],["",1]], 28); merge();
    row([[D.sub + "  ·  " + D.date,7],["",7]]); merge();
    r++;
    row([[t("thItem"),2],[t("xPhotos"),2]], 22);
    for (const g of D.groups){
      row([[g.name + (g.loc ? "  –  " + g.loc : ""),8],["",8]], 20); merge();
      for (const it of g.items){
        const th_ = await thumb(it.f.id, 900);
        if (!th_){ row([[it.cap,3],["—",9]]); continue; }
        const k = Math.min(1, 250 / th_.w, 190 / th_.h);
        const dw = Math.max(1, Math.round(th_.w * k)), dh = Math.max(1, Math.round(th_.h * k));
        n++;
        pics.push({n, row:r - 1, w:dw * 9525, h:dh * 9525, data:new Uint8Array(await th_.blob.arrayBuffer())});
        row([[it.cap,3],["",3]], Math.round(dh * 0.75 + 10));
      }
    }
    const sheet = XML + `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView${isRTL() ? ' rightToLeft="1"' : ""} showGridLines="0" workbookViewId="0"/></sheetViews><cols><col min="1" max="1" width="38" customWidth="1"/><col min="2" max="2" width="38" customWidth="1"/></cols><sheetData>${out.join("")}</sheetData><mergeCells count="${merges.length}">${merges.map(m => `<mergeCell ref="${m}"/>`).join("")}</mergeCells><pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="0"/>${pics.length ? '<drawing r:id="rId1"/>' : ""}</worksheet>`;
    if (!pics.length) return xlsxZip(sheet);

    const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
    const drawing = XML + '<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="' + REL + '">' +
      pics.map(p => `<xdr:oneCellAnchor><xdr:from><xdr:col>1</xdr:col><xdr:colOff>57150</xdr:colOff><xdr:row>${p.row}</xdr:row><xdr:rowOff>47625</xdr:rowOff></xdr:from><xdr:ext cx="${p.w}" cy="${p.h}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${p.n + 1}" name="Picture ${p.n}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rId${p.n}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${p.w}" cy="${p.h}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`).join("") +
      '</xdr:wsDr>';
    const extra = [
      {name:"xl/drawings/drawing1.xml", data: drawing},
      {name:"xl/drawings/_rels/drawing1.xml.rels", data: XML + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + pics.map(p => `<Relationship Id="rId${p.n}" Type="${REL}/image" Target="../media/image${p.n}.jpg"/>`).join("") + '</Relationships>'},
      {name:"xl/worksheets/_rels/sheet1.xml.rels", data: XML + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/drawing" Target="../drawings/drawing1.xml"/></Relationships>`},
      ...pics.map(p => ({name:`xl/media/image${p.n}.jpg`, data:p.data}))
    ];
    const types = '<Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>';
    return xlsxZip(sheet, extra, types);
  }

  /* ---------- Word (.docx) with embedded photos ---------- */
  async function docxBlob(D){
    const rtl = isRTL();
    const land = D.kind === "motors";        // the motors table is wide: landscape page
    const media = [], rels = [];
    let imgN = 0;
    const run = (txt, o={}) => `<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="${rtl ? "Tahoma" : "Calibri"}"/>${o.b?"<w:b/>":""}${o.b&&rtl?"<w:bCs/>":""}${o.i?"<w:i/>":""}${o.i&&rtl?"<w:iCs/>":""}${o.color?`<w:color w:val="${o.color}"/>`:""}<w:sz w:val="${o.sz||20}"/>${rtl?`<w:szCs w:val="${o.sz||20}"/><w:rtl/>`:""}</w:rPr><w:t xml:space="preserve">${esc(txt)}</w:t></w:r>`;
    const para = (inner, o={}) => `<w:p><w:pPr>${o.keep?"<w:keepNext/>":""}${o.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`:""}${rtl?"<w:bidi/>":""}<w:spacing w:before="${o.before||0}" w:after="${o.after==null?60:o.after}"/>${o.jc?`<w:jc w:val="${o.jc}"/>`:""}</w:pPr>${inner}</w:p>`;
    const tc = (txt, w, o={}) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`:""}<w:vAlign w:val="center"/></w:tcPr>${para(run(txt,{b:o.b,color:o.color,sz:o.sz}),{jc:o.jc,after:0})}</w:tc>`;
    const tr = (cells, head) => `<w:tr><w:trPr><w:cantSplit/>${head?"<w:tblHeader/>":""}</w:trPr>${cells}</w:tr>`;
    const bdr = ["top","left","bottom","right","insideH","insideV"].map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="B9C8EA"/>`).join("");
    const tbl = (widths, rows) => `<w:tbl><w:tblPr>${rtl?"<w:bidiVisual/>":""}<w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:tblBorders>${bdr}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${rows}</w:tbl>`;
    const drawing = (n, cx, cy) => `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${n}" name="Picture ${n}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${n}" name="image${n}.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rId${n}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;

    const body = [];
    body.push(para(run(D.title,{b:1,sz:36,color:"1F3A7A"}), {after:40}));
    body.push(para(run(D.sub + "  ·  " + D.date,{sz:18,color:"6D7FA6"}), {after:200}));

    if (D.kind === "motors"){
      /* all parameters as columns, panel names as full-width group rows, totals only under power and current */
      const n = D.cols.length;
      const pw = Math.max(650, Math.floor((15438 - 2100) / Math.max(1, n)));
      const wd = [500, 1600, ...D.cols.map(() => pw)];
      const sum = wd.reduce((a,b) => a + b, 0);
      const fs = n > 12 ? 13 : n > 8 ? 15 : 17;
      let rows = tr(["#", t("thMotor"), ...D.cols.map(c => c.label)].map((hd_,i) => tc(hd_, wd[i], {b:1,color:"FFFFFF",fill:"4A80E8",jc:"center",sz:fs})).join(""), true);
      D.groups.forEach(g => {
        rows += `<w:tr><w:trPr><w:cantSplit/></w:trPr><w:tc><w:tcPr><w:tcW w:w="${sum}" w:type="dxa"/><w:gridSpan w:val="${wd.length}"/><w:shd w:val="clear" w:color="auto" w:fill="1F3A7A"/><w:vAlign w:val="center"/></w:tcPr>${para(run("🗄  " + g.name + (g.loc ? "  –  " + g.loc : ""), {b:1,color:"FFFFFF",sz:fs + 2}), {after:0})}</w:tc></w:tr>`;
        g.rows.forEach((x,i) => {
          const f = i % 2 ? "F5F8FE" : null;
          rows += tr(tc(String(x.i),wd[0],{jc:"center",fill:f,sz:fs}) + tc(x.name,wd[1],{fill:f,sz:fs}) +
                     x.vals.map((v,j) => tc(v,wd[j+2],{jc:"center",fill:f,sz:fs})).join(""));
        });
      });
      rows += tr(tc(String(D.total.count),wd[0],{b:1,jc:"center",fill:"E8EEFB",sz:fs}) + tc(t("totalMotors"),wd[1],{b:1,fill:"E8EEFB",sz:fs}) +
                 D.cols.map((c,j) => tc(c.tot === "kw" ? String(D.total.kw) : c.tot === "a" ? String(D.total.a) : "", wd[j+2], {b:1,jc:"center",fill:"E8EEFB",sz:fs})).join(""));
      body.push(tbl(wd, rows), para(""));
    } else if (D.kind === "photos"){
      /* two photos per row, each with its caption */
      const colW = 4953;
      if (!D.groups.length) body.push(para(run(t("noPhotosAll"),{i:1,color:"8A97B5"})));
      for (const g of D.groups){
        body.push(para(run("  ⚙  " + g.name,{b:1,sz:24,color:"FFFFFF"}), {fill:"1F3A7A", before:240, after:60, keep:1}));
        if (g.loc) body.push(para(run(g.loc,{sz:16,color:"6D7FA6"}), {after:80, keep:1}));
        const cells = [];
        for (const it of g.items){
          const th_ = await thumb(it.f.id, 900);
          let inner = "";
          if (th_){
            imgN++;
            media.push({name:`word/media/image${imgN}.jpg`, data:new Uint8Array(await th_.blob.arrayBuffer())});
            rels.push(`<Relationship Id="rId${imgN}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${imgN}.jpg"/>`);
            const k = Math.min(2700000/th_.w, 2160000/th_.h);
            inner += para(drawing(imgN, Math.round(th_.w*k), Math.round(th_.h*k)), {after:20, jc:"center"});
          }
          inner += para(run(it.cap,{sz:16,color:"444444"}), {after:0, jc:"center"});
          cells.push(inner);
        }
        let rows = "";
        for (let i = 0; i < cells.length; i += 2){
          const c2 = cells[i+1] || para("", {after:0});
          rows += `<w:tr><w:trPr><w:cantSplit/></w:trPr><w:tc><w:tcPr><w:tcW w:w="${colW}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${cells[i]}</w:tc><w:tc><w:tcPr><w:tcW w:w="${colW}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${c2}</w:tc></w:tr>`;
        }
        body.push(tbl([colW, colW], rows), para("", {after:60}));
      }
    } else {
      const wd = [3400,6506];
      for (const m of D.motors){
        body.push(para(run("  ⚙  " + m.name,{b:1,sz:24,color:"FFFFFF"}), {fill:"1F3A7A", before:240, after:100, keep:1}));
        if (!m.equip.length) body.push(para(run(t("noEquipReg"),{i:1,color:"8A97B5"})));
        for (const q of m.equip){
          body.push(para(run("🧰 " + q.name,{b:1,sz:22,color:"4A80E8"}), {before:120, after:60, keep:1}));
          if (q.desc) body.push(para(run(q.desc,{i:1,sz:19,color:"444444"})));
          if (q.specs.length){
            let rows = tr(tc(t("thParam"),wd[0],{b:1,color:"FFFFFF",fill:"4A80E8"}) + tc(t("thValue"),wd[1],{b:1,color:"FFFFFF",fill:"4A80E8"}), true);
            q.specs.forEach(([k,v],i) => { const f = i%2 ? "F5F8FE" : null; rows += tr(tc(k,wd[0],{fill:f}) + tc(v,wd[1],{fill:f})); });
            body.push(tbl(wd, rows), para("", {after:60}));
          }
          let runs = "";
          for (const f of q.photos){
            const th_ = await thumb(f.id, 700);
            if (!th_) continue;
            imgN++;
            media.push({name:`word/media/image${imgN}.jpg`, data:new Uint8Array(await th_.blob.arrayBuffer())});
            rels.push(`<Relationship Id="rId${imgN}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${imgN}.jpg"/>`);
            const k = Math.min(1872000/th_.w, 1872000/th_.h);
            runs += drawing(imgN, Math.round(th_.w*k), Math.round(th_.h*k)) + '<w:r><w:t xml:space="preserve">  </w:t></w:r>';
          }
          if (runs) body.push(para(runs, {after:120}));
        }
      }
    }
    const sect = land
      ? '<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="700" w:right="700" w:bottom="700" w:left="700" w:header="400" w:footer="400" w:gutter="0"/></w:sectPr>'
      : '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1000" w:right="1000" w:bottom="1000" w:left="1000" w:header="500" w:footer="500" w:gutter="0"/></w:sectPr>';
    const doc = XML + `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body.join("")}${sect}</w:body></w:document>`;
    return makeZip([
      {name:"[Content_Types].xml", data: XML + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'},
      {name:"_rels/.rels", data: XML + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'},
      {name:"word/_rels/document.xml.rels", data: XML + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join("")}</Relationships>`},
      {name:"word/document.xml", data: doc},
      ...media,
    ], "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  }

  /* ---------- PDF: opens the print dialog (choose "Save as PDF") ---------- */
  async function exportPDF(D){
    const imgs = {};
    if (D.kind === "equip"){
      for (const m of D.motors) for (const q of m.equip) for (const f of q.photos){
        const th_ = await thumb(f.id, 900);
        if (th_) imgs[f.id] = await toDataURL(th_.blob);
      }
    }
    if (D.kind === "photos"){
      for (const g of D.groups) for (const it of g.items){
        const th_ = await thumb(it.f.id, 900);
        if (th_) imgs[it.f.id] = await toDataURL(th_.blob);
      }
    }
    const land = D.kind === "motors";
    const css = `@page{size:A4${land ? " landscape" : ""};margin:${land ? "10mm" : "14mm"}}*{box-sizing:border-box}
body{font-family:"Segoe UI",Tahoma,Roboto,Arial,sans-serif;color:#1f3a7a;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hd{background:#1f3a7a;color:#fff;padding:14px 18px;border-radius:8px;margin-bottom:14px}
.hd h1{font-size:20px;margin:0}.hd p{margin:5px 0 0;font-size:11px;opacity:.85}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#4a80e8;color:#fff;padding:8px;border:1px solid #b9c8ea}
td{padding:7px 8px;border:1px solid #b9c8ea}
tr{break-inside:avoid}
tbody tr:nth-child(even){background:#f5f8fe}
.c{text-align:center}
tfoot td{background:#e8eefb;font-weight:bold;border-top:2px solid #4a80e8}
table.mt{font-size:9.5px}table.mt th,table.mt td{padding:4px 5px;text-align:center}
table.mt td.l{text-align:start}
table.mt tr.gr td{background:#1f3a7a;color:#fff;font-weight:bold;font-size:11px;text-align:start}
.m{background:#1f3a7a;color:#fff;padding:9px 12px;border-radius:6px;font-weight:bold;font-size:14px;margin:18px 0 8px;break-after:avoid}
.q{margin:0 0 12px;break-inside:avoid}
.q h3{font-size:13px;color:#4a80e8;margin:0 0 5px}
.q p{font-size:11px;color:#444;font-style:italic;margin:0 0 5px}
.ph img{height:70px;width:auto;margin:6px 6px 0 0;border:1px solid #ccd6ee;border-radius:3px}
.no{color:#8a97b5;font-size:12px;font-style:italic}
figure{margin:0}
.pg{display:flex;flex-wrap:wrap;gap:8px}
.fg{width:calc(50% - 4px);margin:0 0 6px;break-inside:avoid}
.fg img{width:100%;max-height:220px;object-fit:contain;border:1px solid #ccd6ee;border-radius:4px;background:#f5f8fe}
.fg figcaption{font-size:10px;color:#444;margin-top:2px;text-align:center}`;
    let html = `<div class="hd"><h1>${esc(D.title)}</h1><p>${esc(D.sub)} · ${esc(D.date)}</p></div>`;
    if (D.kind === "motors"){
      const span = 2 + D.cols.length;
      html += `<table class="mt"><thead><tr><th>#</th><th>${esc(t("thMotor"))}</th>${D.cols.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>` +
        D.groups.map(g => `<tr class="gr"><td colspan="${span}">🗄 ${esc(g.name)}${g.loc ? " · " + esc(g.loc) : ""}</td></tr>` +
          g.rows.map(x => `<tr><td>${x.i}</td><td class="l">${esc(x.name)}</td>${x.vals.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")).join("") +
        `</tbody><tfoot><tr><td>${D.total.count}</td><td class="l">${esc(t("totalMotors"))}</td>${D.cols.map(c => `<td>${c.tot === "kw" ? D.total.kw : c.tot === "a" ? D.total.a : ""}</td>`).join("")}</tr></tfoot></table>`;
    } else if (D.kind === "photos"){
      if (!D.groups.length) html += `<div class="no">${esc(t("noPhotosAll"))}</div>`;
      D.groups.forEach(g => {
        html += `<div class="m">⚙ ${esc(g.name)}</div>` + (g.loc ? `<div class="no" style="margin-bottom:6px">${esc(g.loc)}</div>` : "") +
          `<div class="pg">` + g.items.map(it => `<figure class="fg">${imgs[it.f.id] ? `<img src="${imgs[it.f.id]}">` : ""}<figcaption>${esc(it.cap)}</figcaption></figure>`).join("") + `</div>`;
      });
    } else {
      D.motors.forEach(m => {
        html += `<div class="m">⚙ ${esc(m.name)}</div>`;
        if (!m.equip.length) html += `<div class="no">${esc(t("noEquipReg"))}</div>`;
        m.equip.forEach(q => {
          html += `<div class="q"><h3>${esc(q.name)}</h3>${q.desc ? `<p>${esc(q.desc)}</p>` : ""}`;
          if (q.specs.length) html += `<table><thead><tr><th style="text-align:start;width:38%">${esc(t("thParam"))}</th><th style="text-align:start">${esc(t("thValue"))}</th></tr></thead><tbody>` +
            q.specs.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("") + `</tbody></table>`;
          const ph = q.photos.filter(f => imgs[f.id]).map(f => `<img src="${imgs[f.id]}">`).join("");
          if (ph) html += `<div class="ph">${ph}</div>`;
          html += `</div>`;
        });
      });
    }
    const fr = document.createElement("iframe");
    fr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(fr);
    const doc = fr.contentWindow.document;
    doc.open();
    doc.write(`<!DOCTYPE html><html dir="${isRTL() ? "rtl" : "ltr"}" lang="${LANG}"><head><meta charset="utf-8"><title>${esc(D.base)}</title><style>${css}</style></head><body>${html}</body></html>`);
    doc.close();
    await Promise.all([...doc.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
    fr.contentWindow.focus();
    fr.contentWindow.print();
    setTimeout(() => fr.remove(), 120000);
  }

  /* ===== Admin actions ===== */
  function addItem(list, lvl){
    if (!admin) return;
    const name = (prompt(t("newName", lvl.toLowerCase())) || "").trim();
    if (!name) return;
    if (list.some(n => n.name.toLowerCase() === name.toLowerCase())) { alert(t("exists")); return; }
    list.push({id: uid(), name, children: []});
    saveTree(); render();
  }
  function renameItem(n){
    const name = (prompt(t("renamePrompt"), n.name) || "").trim();
    if (!name) return;
    n.name = name; saveTree(); render();
  }
  function removeItem(n){
    if (!confirm(t("delItem", n.name))) return;
    const {list} = walk();
    const i = list.indexOf(n);
    if (i > -1) list.splice(i,1);
    dropAll(n);
    saveTree(); saveDeleted(); render();
  }
  function dropAll(n){
    del("img_" + n.id);
    del("img_zh_" + n.id);
    if (!deleted.includes(n.id)) deleted.push(n.id);
    allFiles(n).forEach(f => dbDel(f.id));
    n.children.forEach(dropAll);
  }

  /* ----- copy a whole folder (sub-items, specs, equipment, photos and files) ----- */
  async function reId(n){
    const old = n.id;
    n.id = uid();
    ["img_", "img_zh_"].forEach(p => { const v = load(p + old); if (v) save(p + n.id, v); });
    ["zones", "zh"].forEach(k => {
      if (texts[k] && texts[k][old]) texts[k][n.id] = JSON.parse(JSON.stringify(texts[k][old]));
    });
    const dup = async f => {
      const b = await dbGet(f.id), id = uid();
      if (b) await dbPut(id, b);
      return {...f, id};
    };
    const dups = async arr => { const o = []; for (const f of (arr || [])) o.push(await dup(f)); return o; };
    if (n.plate) n.plate = await dup(n.plate);
    if (n.specFiles) n.specFiles = await dups(n.specFiles);
    if (n.drawFiles) n.drawFiles = await dups(n.drawFiles);
    for (const q of (n.equip || [])){
      q.id = uid();
      q.photos = await dups(q.photos);
      q.files = await dups(q.files);
    }
    for (const k of (n.children || [])) await reId(k);
  }
  async function copyItem(list, n){
    if (!admin) return;
    toast(t("copying"), 0);
    let name = n.name + t("copySuffix"), i = 2;
    while (list.some(x => x.name.toLowerCase() === name.toLowerCase())) name = n.name + t("copySuffix") + " " + i++;
    try{
      const c = JSON.parse(JSON.stringify(n));
      await reId(c);
      c.name = name;
      list.splice(list.indexOf(n) + 1, 0, c);
      saveTree(); saveTexts();
      toast(t("copied"), 2500);
      render();
    }catch(e){
      console.error(e);
      toast(t("saveFail"), 4000);
    }
  }

  /* ===== Card, zone and banner photos (admin only) ===== */
  const fileInput = $("file");
  function pick(key){
    if (!admin) return;
    target = key; fileInput.value = ""; fileInput.click();
  }
  $("heroBtn").onclick = () => pick("hero");
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (!admin || !f || !target) return;
    const tg = target, isHero = tg === "hero", isZh = tg.startsWith("zh_");
    const isZone = !isHero && !isZh && tree.some(z => z.id === tg);
    resize(f, (isHero || isZh) ? 900 : isZone ? 640 : 256, isHero || isZh || isZone)
      .then(data => { if (save("img_" + tg, data)) render(); });
  });
  function resize(file, size, keepRatio){
    return new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas"), ctx = c.getContext("2d");
        if (keepRatio){
          const r = Math.min(1, size / img.width);
          c.width = img.width * r; c.height = img.height * r;
          ctx.drawImage(img, 0, 0, c.width, c.height);
        } else {
          const s = Math.min(img.width, img.height);
          c.width = c.height = size;
          ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
        }
        URL.revokeObjectURL(img.src);
        res(c.toDataURL("image/jpeg", 0.85));
      };
      img.src = URL.createObjectURL(file);
    });
  }

  /* ===== Export / Import / Reset (admin only) ===== */
  const toDataURL = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
  /* settings file: default theme + edited texts. Upload it as "config.json" next to the app:
     everybody who opens the app online gets it automatically. */
  function exportCfg(){
    const c = {v:1, theme: load("themedefault") || null, texts};
    dl(new Blob([JSON.stringify(c, null, 1)], {type:"application/json"}), "config.json");
  }
  async function doExport(){
    const imgs = {};
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k.startsWith("img_")) imgs[k] = localStorage.getItem(k);
    }
    const files = {};
    for (const k of await dbKeys()) files[k] = await toDataURL(await dbGet(k));
    const blob = new Blob([JSON.stringify({tree, deleted, imgs, files, users, texts})], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "workshop-data.json";
    a.click();
  }
  $("imp").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f || !me || !me.owner) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.tree)) throw 0;
        tree = d.tree;
        deleted = Array.isArray(d.deleted) ? d.deleted : [];
        if (Array.isArray(d.users)){ users = d.users; saveUsers(); }
        if (d.texts && typeof d.texts === "object"){ texts = d.texts; saveTexts(); }
        merge(tree, seed());
        saveTree(); saveDeleted();
        Object.entries(d.imgs || {}).forEach(([k,v]) => save(k, v));
        for (const [k,v] of Object.entries(d.files || {})) await dbPut(k, await (await fetch(v)).blob());
        path = []; eqOpen = null; rep = null; render(); alert(t("imported"));
      } catch(err){ alert(t("invalid")); }
    };
    r.readAsText(f);
    e.target.value = "";
  });
  async function doReset(){
    if (!confirm(t("resetQ"))) return;
    Object.keys(localStorage).filter(k => k.startsWith("img_")).forEach(del);
    await dbClear();
    deleted = []; tree = seed();
    saveTree(); saveDeleted(); path = []; eqOpen = null; rep = null; render();
  }

  /* ===== Search (inside a zone / room / panel) ===== */
  $("q").addEventListener("input", e => {
    const v = e.target.value.trim().toLowerCase();
    $("grid").querySelectorAll(".card:not(.add):not(.rep)").forEach(c =>
      c.classList.toggle("hidden", !c.dataset.name.includes(v)));
  });

  /* ===== Phone back button ===== */
  history.replaceState({p:[], e:null, r:null}, "");
  window.addEventListener("popstate", e => {
    closeMenu();
    if ($("lb").style.display === "grid") closeLightbox();
    path = (e.state && e.state.p) ? [...e.state.p] : [];
    eqOpen = (e.state && e.state.e) || null;
    rep = (e.state && e.state.r) || null;
    render();
  });

  applyTheme();
  applyLang();
  render();
  pullRemote();
  askPersist();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>

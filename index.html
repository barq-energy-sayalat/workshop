<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c5fd6">
<link rel="manifest" href="manifest.json">
<title>BIS CO. – Plant Dashboard</title>
<style>
  :root{--blue:#4a80e8;--dark:#1f3a7a;--deep:#12296b;--ink:#10265e;--mid:#2c5fd6;--lite:#6ea2ff;
        --bg:#dfe8f8;--tint:#eaf0fd;--tint2:#f5f8fe;--g1:#eef4ff;--g2:#dfe9ff}
  *{box-sizing:border-box;margin:0;font-family:"Segoe UI",Tahoma,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);min-height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:430px;min-height:100vh;background:#fff;position:relative;overflow:hidden}
  .app.root{background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 100%)}
  .app.motor{background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 100%)}

  .hero{position:relative;color:#fff;padding:50px 24px 70px;
    border-radius:0 0 44px 44px;overflow:hidden;
    background-color:var(--blue);background-size:cover;background-position:center}
  .hero.small{padding:46px 24px 60px}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
  .hero::before{width:220px;height:220px;right:-70px;top:-60px}
  .hero::after{width:160px;height:160px;left:-50px;bottom:20px}
  .top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
  .menu{width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
  .menu div{width:26px;height:18px;display:flex;flex-direction:column;justify-content:space-between}
  .menu i{height:3px;background:#fff;border-radius:3px}
  .menu i:nth-child(2){width:70%}
  .tools{display:flex;gap:10px;align-items:center}
  .btn{width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid rgba(255,255,255,.6);
    display:grid;place-items:center;font-size:20px;cursor:pointer;color:var(--blue);font-weight:bold}
  #heroBtn{display:none}
  body.admin #heroBtn{display:grid}
  .pill{display:none;background:#ffd95a;color:#6b4e00;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:bold}
  body.admin .pill{display:block}
  .hero h1{margin-top:26px;font-size:26px;line-height:1.4;position:relative;z-index:1;letter-spacing:.3px}
  .hero p{margin-top:8px;font-size:13px;opacity:.9;position:relative;z-index:1}

  .search{position:relative;z-index:2;margin:-26px 24px 0;background:#fff;border-radius:16px;
    box-shadow:0 10px 25px rgba(40,70,150,.2);display:flex;align-items:center;padding:0 16px;gap:10px}
  .search input{flex:1;border:0;outline:0;padding:16px 0;font-size:14px;background:transparent;color:var(--dark)}
  .search span{opacity:.5}

  .label{text-align:center;color:#8a97b5;font-size:14px;margin:26px 0 16px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 24px 40px}
  .card{position:relative;background:#fff;border-radius:20px;padding:22px 10px 18px;
    text-align:center;cursor:pointer;color:var(--dark);
    box-shadow:0 2px 0 var(--bg),0 8px 22px rgba(40,70,150,.18);
    transition:transform .15s;word-break:break-word}
  .card:active{transform:scale(.96)}

  /* ===== 3D icon ===== */
  .icon{
    width:64px;height:64px;margin:0 auto 14px;border-radius:18px;
    position:relative;display:grid;place-items:center;font-size:32px;overflow:hidden;
    background:linear-gradient(145deg,var(--lite) 0%,var(--blue) 50%,var(--mid) 100%);
    text-shadow:0 3px 3px rgba(0,0,0,.35);
    transform:translateY(-3px);
    transition:transform .15s, box-shadow .15s;
    box-shadow:
      inset 0 3px 4px rgba(255,255,255,.6),
      inset 0 -6px 8px rgba(20,45,120,.45),
      0 2px 0 #2c56b0,
      0 5px 0 #234a9e,
      0 11px 16px rgba(31,58,122,.45);
  }
  .icon::after{
    content:"";position:absolute;left:0;right:0;top:0;height:48%;
    background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,0));
    border-radius:18px 18px 60% 60%/18px 18px 22px 22px;
    pointer-events:none;
  }
  .icon img{width:100%;height:100%;object-fit:cover}
  .card:active .icon{
    transform:translateY(2px);
    box-shadow:
      inset 0 3px 4px rgba(255,255,255,.5),
      inset 0 -4px 6px rgba(20,45,120,.4),
      0 1px 0 #234a9e,
      0 4px 8px rgba(31,58,122,.4);
  }
  .icon.real3d{
    background:none;box-shadow:none;overflow:visible;
    transform:none;width:72px;height:72px;margin-bottom:10px;
  }
  .icon.real3d::after{display:none}
  .icon.real3d img{
    object-fit:contain;
    filter:drop-shadow(0 8px 8px rgba(31,58,122,.35));
    transition:transform .15s;
  }
  .card:active .icon.real3d{transform:none;box-shadow:none}
  .card:active .icon.real3d img{transform:scale(.92)}

  .card b{display:block;font-size:16px;letter-spacing:.5px}
  .badge{position:absolute;top:8px;width:30px;height:30px;border-radius:50%;
    background:var(--tint);display:none;place-items:center;font-size:14px;cursor:pointer}
  .b-cam{left:8px}
  .b-edit{right:8px}
  .b-del{right:42px;background:#fde3e3}
  .b-copy{left:8px;top:44px}
  body.admin .badge{display:grid}
  .card.add{border:2px dashed var(--blue);box-shadow:none;color:var(--blue);display:none}
  body.admin .card.add{display:block}
  .card.add .icon{background:var(--tint);color:var(--blue);box-shadow:none;font-size:34px}
  .card.add .icon{transform:none;text-shadow:none}
  .card.add .icon::after{display:none}
  .hidden{display:none!important}
  .empty{grid-column:1/3;text-align:center;color:#8a97b5;font-size:14px;padding:30px 10px;line-height:1.8}

  /* ===== Main dashboard (home) ===== */
  #dash{display:none;position:relative;min-height:100vh;overflow:hidden}
  #dash::before{content:"";position:absolute;top:-130px;right:-100px;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,var(--lite),var(--mid) 60%,var(--deep));z-index:0}
  #dash::after{content:"";position:absolute;top:-70px;left:-140px;width:300px;height:220px;border-radius:50%;
    background:rgba(120,165,255,.22);z-index:0}
  .dtop{position:relative;z-index:1;direction:ltr;display:flex;justify-content:space-between;align-items:center;
    padding:calc(18px + env(safe-area-inset-top,0px)) 20px 0}
  .dlogo{display:flex;align-items:center;gap:8px;color:var(--deep);font-weight:900;font-size:24px;letter-spacing:.5px}
  .dtools{display:flex;gap:10px}
  .dbtn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;
    cursor:pointer;box-shadow:0 4px 14px rgba(20,50,140,.25);position:relative}
  .dbtn.adm::after{content:"";position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;
    background:#35d070;border:2px solid #fff}
  .hb{width:24px;height:16px;display:flex;flex-direction:column;justify-content:space-between}
  .hb i{height:3px;background:#fff;border-radius:3px}
  .hb i:nth-child(2){width:75%}
  .dban{position:relative;z-index:1;direction:ltr;margin:18px 18px 0;border-radius:28px;overflow:hidden;min-height:190px;
    background:linear-gradient(120deg,var(--tint2) 0%,var(--g2) 55%,var(--g2) 100%);box-shadow:0 14px 30px rgba(40,70,150,.22);display:flex}
  .dban .bimg{position:absolute;right:0;top:0;bottom:0;width:64%;background-size:cover;background-position:center;
    -webkit-mask-image:linear-gradient(to left,#000 55%,transparent);mask-image:linear-gradient(to left,#000 55%,transparent)}
  .dban .bimg svg{position:absolute;right:0;bottom:4px;width:100%;height:auto}
  .dban .btxt{position:relative;z-index:1;padding:22px 14px 20px 20px;max-width:60%;text-align:left}
  .dots{display:flex;gap:6px;margin-bottom:14px}
  .dots i{width:10px;height:10px;border-radius:50%;background:#b6c7ee}
  .dots i:first-child{background:var(--mid)}
  .btxt .h1{font-size:15px;font-weight:700;color:var(--dark)}
  .btxt .h2{font-size:21px;font-weight:900;color:var(--ink);line-height:1.5;margin-top:2px}
  .btxt .h3{font-size:12px;color:#415582;margin-top:8px}
  .btxt .line{width:38px;height:3px;border-radius:3px;background:var(--mid);margin:10px 0 14px}
  .bbtn{display:inline-flex;align-items:center;gap:10px;background:var(--deep);color:#fff;border-radius:22px;
    padding:11px 20px;font-size:13px;cursor:pointer;box-shadow:0 8px 16px rgba(18,41,107,.35)}
  .dcam,.dedit{position:absolute;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;background:#fff;
    display:none;place-items:center;cursor:pointer;box-shadow:0 4px 10px rgba(20,50,140,.25)}
  .dcam{top:10px}
  .dedit{top:52px}
  body.admin .dcam,body.admin .dedit{display:grid}
  .dsearch{position:relative;z-index:1;direction:ltr;margin:18px 18px 0;background:#fff;border-radius:22px;
    box-shadow:0 10px 26px rgba(40,70,150,.18);display:flex;align-items:center;gap:12px;padding:0 20px}
  .dsearch input{flex:1;border:0;outline:0;background:transparent;padding:19px 0;font-size:14px;color:var(--dark)}
  .dres{position:relative;z-index:1;padding:16px 18px 0;display:none}
  .rrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;
    box-shadow:0 6px 16px rgba(40,70,150,.12);cursor:pointer;color:var(--dark)}
  .rrow .ri{width:40px;height:40px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:20px}
  .rrow .rtx{flex:1;min-width:0}
  .rrow b{display:block;font-size:14px}
  .rrow small{display:block;color:#8a97b5;font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zgrid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 18px 0}
  .zc{position:relative;direction:ltr;text-align:left;border-radius:24px;padding:16px 14px 14px;min-height:152px;
    overflow:hidden;cursor:pointer;background:linear-gradient(135deg,var(--zt) 0%,#fff 100%);
    box-shadow:0 10px 24px rgba(40,70,150,.16);transition:transform .15s}
  .zc:active{transform:scale(.97)}
  .zc .zp{position:absolute;right:0;top:0;width:60%;height:60%;background-size:cover;background-position:center;
    -webkit-mask-image:linear-gradient(to left,#000 45%,transparent);mask-image:linear-gradient(to left,#000 45%,transparent)}
  .zc::after{content:"";position:absolute;left:-12px;bottom:-16px;width:60%;height:26px;border-radius:50%;
    background:var(--zc);opacity:.9}
  .zc .zi{position:relative;z-index:1;width:52px;height:52px;border-radius:50%;background:var(--zc);display:grid;
    place-items:center;box-shadow:0 0 0 6px rgba(255,255,255,.75),0 8px 16px rgba(20,50,120,.25)}
  .zc .zi svg{width:28px;height:28px}
  .zc b{position:relative;z-index:1;display:block;margin-top:14px;font-size:19px;color:var(--ink);letter-spacing:.3px}
  .zc small{position:relative;z-index:1;display:block;margin-top:2px;font-size:12px;color:#4b5f8e}
  .zc .zgo{position:absolute;right:12px;bottom:14px;width:34px;height:34px;border-radius:50%;background:var(--zc);
    color:#fff;display:grid;place-items:center;font-size:22px;z-index:2;box-shadow:0 6px 12px rgba(20,50,120,.3)}
  .zgrid .card.add{min-height:152px;direction:ltr;display:none;place-content:center}
  body.admin .zgrid .card.add{display:grid}
  .dsum{position:relative;z-index:1;margin:16px 18px 0;background:rgba(255,255,255,.88);border-radius:26px;
    box-shadow:0 10px 26px rgba(40,70,150,.15);padding:16px 8px 18px}
  .dsum h4{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dark);padding:0 10px 14px}
  .sgrid{display:grid;grid-template-columns:repeat(4,1fr)}
  .sitem{text-align:center;padding:0 3px;border-inline-start:1px solid #dbe4f7}
  .sitem:first-child{border-inline-start:0}
  .sring{width:76px;height:76px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;
    background:conic-gradient(var(--rc) calc(var(--p) * 1%),#e3eafa 0)}
  .sring .in{width:60px;height:60px;border-radius:50%;background:#fff;display:grid;place-items:center;
    box-shadow:inset 0 0 0 1px #eef2fb}
  .sring svg{width:30px;height:30px}
  .sval{font-size:19px;font-weight:900;color:var(--ink)}
  .slab{font-size:11.5px;color:#4b5f8e;line-height:1.55;margin-top:2px}
  .dfoot{position:relative;z-index:1;direction:ltr;margin-top:24px;background:linear-gradient(180deg,var(--mid),var(--deep));
    color:#fff;border-radius:34px 34px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;overflow:hidden}
  .dfoot .sky{position:absolute;left:0;bottom:0;opacity:.3;height:60px;pointer-events:none}
  .dfoot .fm{font-weight:700;letter-spacing:1px;font-size:15px;position:relative}
  .dfoot .fr{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:12px;position:relative}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#9aa7c4}

  /* ===== Zone dashboard (photo header + motor stats) ===== */
  #zdash{display:none;position:relative}
  .zhead{position:relative;min-height:330px;overflow:hidden;border-radius:0 0 40px 40px;
    background:linear-gradient(135deg,#cfe0ff 0%,#8fb4ff 100%);box-shadow:0 14px 30px rgba(40,70,150,.22)}
  .zhead .zimg{position:absolute;inset:0;background-size:cover;background-position:center}
  .zhead .zov{position:absolute;inset:0;
    background:linear-gradient(var(--ovd,to left),rgba(255,255,255,.96) 0%,rgba(255,255,255,.8) 42%,rgba(255,255,255,0) 78%)}
  html[dir=ltr] .zhead .zov{--ovd:to right}
  .ztop{position:relative;z-index:2;direction:ltr;display:flex;justify-content:space-between;align-items:center;
    padding:calc(18px + env(safe-area-inset-top,0px)) 18px 0}
  .ztx{position:relative;z-index:2;padding:22px 22px 32px;max-width:64%}
  .zname{display:flex;align-items:center;gap:12px}
  .zbi{width:52px;height:52px;border-radius:50%;background:var(--zc);display:grid;place-items:center;flex:none;
    box-shadow:0 0 0 6px rgba(255,255,255,.75),0 8px 16px rgba(20,50,120,.25)}
  .zbi svg{width:28px;height:28px}
  .zname b{font-size:30px;font-weight:900;color:var(--ink);letter-spacing:.5px;word-break:break-word}
  .zh1{margin-top:16px;font-size:20px;font-weight:900;color:var(--ink);line-height:1.6}
  .zh2{margin-top:6px;font-size:12.5px;color:#415582}
  .zcam,.zedit{position:absolute;bottom:14px;z-index:3;width:40px;height:40px;border-radius:50%;background:#fff;
    display:none;place-items:center;cursor:pointer;box-shadow:0 4px 10px rgba(20,50,140,.25);font-size:18px}
  .zcam{inset-inline-end:14px}
  .zedit{inset-inline-end:62px}
  body.admin .zcam,body.admin .zedit{display:grid}
  .zstat{margin:16px 18px 0;background:rgba(255,255,255,.92);border-radius:26px;
    box-shadow:0 10px 26px rgba(40,70,150,.15);padding:16px 14px}
  .zstat h4{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--dark);padding:0 4px 14px}
  .zsg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .zs{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--zt) 0%,#fff 100%);
    border-radius:20px;padding:14px 12px;box-shadow:0 6px 16px rgba(40,70,150,.12);min-width:0}
  .zs .zsi{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;
    box-shadow:0 4px 10px rgba(40,70,150,.15)}
  .zs .zsi svg{width:26px;height:26px}
  .zs .sv{font-weight:900;font-size:19px;color:var(--ink);direction:ltr;unicode-bidi:plaintext;white-space:nowrap}
  .zs .sl{font-size:12px;color:#4b5f8e;margin-top:2px}
  .zs .tx{min-width:0}

  /* Drawer menu */
  #ov{position:fixed;inset:0;background:rgba(15,30,70,.5);display:none;z-index:40}
  #drawer{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:82%;background:#fff;z-index:41;
    transform:translateX(-100%);transition:transform .25s;padding:34px 18px;overflow:auto;
    border-radius:0 26px 26px 0;box-shadow:10px 0 30px rgba(0,0,0,.2)}
  body.menu-open #ov{display:block}
  body.menu-open #drawer{transform:none}
  #drawer h2{color:var(--dark);font-size:18px;margin-bottom:6px}
  #drawer .st{font-size:12px;color:#8a97b5;margin-bottom:18px}
  #drawer .st.on{color:#c58a00}
  .mi{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--tint2);
    color:var(--dark);font-size:14px;margin-bottom:10px;cursor:pointer}
  .mi.red{background:#fde3e3;color:#b3302c}
  .mi.out{background:#fff3d1;color:#7a5b00}
  .mi.login{background:var(--blue);color:#fff;font-weight:bold;box-shadow:0 5px 12px rgba(74,128,232,.4)}
  .mi.info{display:block;font-size:12px;line-height:1.9;white-space:pre-line;background:var(--tint)}
  .mi.info.warnc{background:#fde3e3;color:#b3302c}
  .langlab{font-size:12px;color:#8a97b5;margin-bottom:6px}
  .langrow{display:flex;gap:8px;margin-bottom:18px}
  .lg{flex:1;text-align:center;padding:11px 6px;border-radius:12px;background:var(--tint2);color:var(--dark);
    font-size:14px;cursor:pointer}
  .lg.on{background:var(--blue);color:#fff;font-weight:bold;box-shadow:0 5px 12px rgba(74,128,232,.4)}
  .themerow{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .thc{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 2px #d5e0f7}
  .thc.on{box-shadow:0 0 0 3px var(--dark)}
  .thc.rs{background:var(--tint2);display:grid;place-items:center;color:var(--dark);font-size:16px}

  /* Motor page */
  #detail{padding:22px 20px 50px;display:none}
  #detail.mp{padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .tabs{display:flex;gap:8px;background:#eef3fc;border-radius:16px;padding:5px;margin-bottom:18px}
  #detail.mp .tabs{background:#fff;margin:14px 0 0;box-shadow:0 8px 22px rgba(40,70,150,.12)}
  .tab{flex:1;text-align:center;padding:11px 4px;border-radius:12px;font-size:12.5px;color:#6d7fa6;cursor:pointer}
  .tab.on{background:var(--blue);color:#fff;box-shadow:0 5px 12px rgba(74,128,232,.4)}

  .mtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .cbtn{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;
    font-size:19px;font-weight:bold;cursor:pointer;flex:none;box-shadow:0 6px 16px rgba(40,70,150,.18)}
  .mcrumb{flex:1;min-width:0;font-size:12px;color:#6d7fa6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mhero{position:relative;border-radius:26px;overflow:hidden;padding:20px 18px;color:#fff;min-height:170px;
    background:linear-gradient(135deg,var(--deep) 0%,var(--mid) 62%,var(--blue) 100%);
    box-shadow:0 14px 30px rgba(31,58,122,.35)}
  .mhero::before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;inset-inline-end:-60px;bottom:-90px;
    background:radial-gradient(circle,rgba(120,180,255,.55),rgba(120,180,255,0) 70%)}
  .mhero .mimg{position:absolute;inset-inline-end:-6px;bottom:0;width:56%}
  .mhero .mimg svg{display:block;width:100%;height:auto}
  .mhero .tx{position:relative;z-index:1;max-width:62%}
  .mhero .lb{font-size:13px;opacity:.9}
  .mhero h2{font-size:24px;font-weight:900;margin:2px 0 6px;letter-spacing:.5px;line-height:1.3;
    word-break:break-word;unicode-bidi:plaintext;text-align:start}
  .mhero .path{font-size:11px;opacity:.85;line-height:1.7;word-break:break-word}
  .spill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 14px;border-radius:20px;
    font-size:12.5px;font-weight:bold;background:rgba(34,197,94,.22);border:1px solid #4ade80;color:#d9ffe6}
  .spill i{width:10px;height:10px;border-radius:50%;background:#35d070;box-shadow:0 0 8px #35d070}
  .spill.warn{background:rgba(250,190,40,.2);border-color:#fbbf24;color:#fff2c9}
  .spill.warn i{background:#fbbf24;box-shadow:0 0 8px #fbbf24}

  .msum{background:#fff;border-radius:24px;padding:16px;margin-top:14px;box-shadow:0 8px 22px rgba(40,70,150,.12)}
  .msum h4{font-size:15px;color:var(--dark);margin-bottom:12px}
  .msum .mrow{display:flex;align-items:center;gap:14px}
  .msum .rw{text-align:center;font-size:11px;color:#4b5f8e;flex:none}
  .msum .sring{margin:0 auto 6px}
  .msum .pv{font-size:17px;font-weight:900;color:var(--ink)}
  .msum .rows{flex:1;min-width:0}
  .srow{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;color:var(--dark)}
  .srow .si{width:28px;height:28px;border-radius:9px;background:var(--tint);display:grid;place-items:center;font-size:14px;flex:none}
  .srow .sk{flex:1;color:#6d7fa6}
  .srow b{direction:ltr;unicode-bidi:plaintext}

  .mcard{background:#fff;border-radius:22px;padding:16px;margin-top:14px;box-shadow:0 8px 22px rgba(40,70,150,.12)}
  .mcard>.sec:last-child{margin-bottom:0}
  .mcard .plate{margin-bottom:14px}
  .ktiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kt{display:flex;align-items:center;gap:10px;background:var(--tint2);border-radius:16px;padding:12px 10px}
  .kt .ic{width:36px;height:36px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:17px;flex:none}
  .kt .kk{font-size:11px;color:#6d7fa6}
  .kt .kv{font-weight:900;font-size:15px;color:var(--dark);direction:ltr;unicode-bidi:plaintext;word-break:break-word}
  .ecards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ec{position:relative;background:var(--tint2);border-radius:18px;padding:18px 8px 12px;text-align:center;cursor:pointer;color:var(--dark)}
  .ec:active{transform:scale(.97)}
  .ec .ei{width:48px;height:48px;border-radius:50%;background:var(--tint);margin:0 auto 8px;display:grid;place-items:center;font-size:23px}
  .ec b{display:block;font-size:13px;word-break:break-word}
  .ec small{display:block;font-size:11px;color:#8a97b5;margin-top:3px;direction:ltr;unicode-bidi:plaintext;word-break:break-word}
  .ec .mini{position:absolute;top:8px;font-size:13px;display:none;cursor:pointer}
  body.admin .ec .mini{display:block}
  .ec .m1{inset-inline-start:10px}
  .ec .m2{inset-inline-start:34px}

  .sec{margin-bottom:22px}
  .sec h3{font-size:14px;color:var(--dark);margin-bottom:10px}
  .spec{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:var(--tint2);margin-bottom:8px;font-size:14px;color:var(--dark)}
  .spec .k{flex:1;color:#6d7fa6}
  .spec .v{font-weight:bold;min-width:70px;text-align:right;word-break:break-word}
  .spec .mini{cursor:pointer;font-size:15px}
  .addbtn{width:100%;border:2px dashed var(--blue);background:#fff;color:var(--blue);border-radius:14px;
    padding:12px;font-size:14px;cursor:pointer;margin-top:4px;display:none}
  body.admin .addbtn{display:block}
  .fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .fitem{position:relative;text-align:center;cursor:pointer}
  .thumb{aspect-ratio:1;border-radius:14px;background:var(--tint);display:grid;place-items:center;font-size:34px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .fname{margin-top:5px;font-size:10.5px;color:#6d7fa6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcap{margin-top:5px;font-size:10.5px;color:#6d7fa6;line-height:1.4;word-break:break-word}
  .fsize{font-size:10px;color:#9aa7c4;direction:ltr;margin-top:1px}
  .fdel{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fde3e3;
    display:none;place-items:center;font-size:12px}
  body.admin .fdel{display:grid}
  .ftile{aspect-ratio:1;border:2px dashed var(--blue);border-radius:14px;color:var(--blue);
    display:none;place-items:center;font-size:30px;cursor:pointer}
  body.admin .ftile{display:grid}
  .nofile{grid-column:1/4;color:#9aa7c4;font-size:12px;text-align:center;padding:8px}

  /* Nameplate */
  .plate{margin-bottom:22px}
  .plate img{display:block;width:100%;height:auto;max-height:75vh;object-fit:contain;background:#eef3fc;
    border-radius:16px;cursor:zoom-in;box-shadow:0 6px 20px rgba(40,70,150,.18)}
  .plate .hint{font-size:11px;color:#8a97b5;text-align:center;margin-top:8px}
  .plate .none{aspect-ratio:4/3;border:2px dashed #b9c8ea;border-radius:16px;display:grid;place-items:center;
    color:#8a97b5;font-size:14px;text-align:center;padding:10px;background:#f7faff}
  .pbtns{display:none;gap:8px;margin:10px 0}
  body.admin .pbtns{display:flex}
  .pbtn{flex:1;text-align:center;padding:11px 6px;border-radius:12px;background:var(--tint);color:var(--blue);
    font-size:13px;cursor:pointer}
  .pbtn.red{background:#fde3e3;color:#b3302c}

  /* Equipment list + page */
  .eqrow{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:#fff;
    box-shadow:0 6px 18px rgba(40,70,150,.13);margin-bottom:10px;cursor:pointer;color:var(--dark)}
  .eqrow .n{flex:1;font-weight:bold;font-size:15px;word-break:break-word}
  .eqrow small{display:block;font-weight:normal;color:#8a97b5;font-size:11px;margin-top:3px}
  .eqrow .go{color:#9aa7c4;font-size:22px}
  .eqrow .mini{cursor:pointer;font-size:15px;display:none}
  body.admin .eqrow .mini{display:inline}
  textarea.desc{width:100%;min-height:90px;border:1.5px solid #d5e0f7;border-radius:12px;padding:12px;
    font-size:14px;color:var(--dark);resize:vertical;font-family:inherit;outline:none;background:var(--tint2)}
  .descv{padding:12px 14px;border-radius:12px;background:var(--tint2);font-size:14px;color:var(--dark);
    white-space:pre-wrap;line-height:1.7;word-break:break-word}

  /* Reports */
  .rhead{display:flex;gap:8px;margin-bottom:16px}
  .rexp{flex:1;text-align:center;padding:12px 4px;border-radius:12px;font-size:13px;font-weight:bold;
    cursor:pointer;color:#fff;box-shadow:0 5px 12px rgba(40,70,150,.25)}
  .rexp.x{background:#1e8a4c}
  .rexp.p{background:#c8402f}
  .rexp.w{background:#2b5fc9}
  .rmeta{font-size:12px;color:#6d7fa6;margin-bottom:12px;line-height:1.7}
  .rwrap{overflow-x:auto;border-radius:14px;box-shadow:0 6px 20px rgba(40,70,150,.13)}
  table.rt{width:100%;border-collapse:collapse;font-size:13px;color:var(--dark)}
  table.rt th{background:var(--blue);color:#fff;padding:11px 8px;font-size:12px;text-align:center}
  table.rt td{padding:10px 8px;border-bottom:1px solid #e3eafa;text-align:center}
  table.rt th.l,table.rt td.l{text-align:left}
  table.rt tbody tr:nth-child(even){background:var(--tint2)}
  table.rt tfoot td{background:#e8eefb;font-weight:bold;border-top:2px solid var(--blue);border-bottom:0}
  .rnote{font-size:11px;color:#8a97b5;margin-top:10px;line-height:1.6}
  .rmotor{margin-bottom:18px}
  .rmotor>h4{background:var(--dark);color:#fff;padding:12px 14px;border-radius:12px 12px 0 0;font-size:14px;
    display:flex;justify-content:space-between;gap:8px}
  .rmotor>h4 small{font-weight:normal;opacity:.8;font-size:11px;align-self:center}
  .rmotor .body{border:1px solid #dbe5f8;border-top:0;border-radius:0 0 12px 12px;padding:8px}
  .rmotor .none{color:#9aa7c4;font-size:12px;text-align:center;padding:10px}
  details.req{border-radius:10px;background:var(--tint2);margin-bottom:8px;overflow:hidden}
  details.req summary{padding:12px;cursor:pointer;color:var(--dark);font-weight:bold;font-size:14px;
    list-style:none;display:flex;justify-content:space-between;gap:8px}
  details.req summary::-webkit-details-marker{display:none}
  details.req summary small{font-weight:normal;color:#8a97b5;font-size:11px;align-self:center}
  details.req .in{padding:0 10px 12px}
  details.req .in>*{margin-bottom:10px}

  /* Fullscreen viewer */
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:50;
    padding:14px;overflow:hidden}
  #lb img{max-width:100%;max-height:100%;border-radius:6px}
  #lbImg{touch-action:none;user-select:none;-webkit-user-drag:none;transform-origin:center}
  #lbClose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;
    border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;
    font-size:20px;cursor:pointer;z-index:2}

  /* OCR result dialog + toast */
  #mod{position:fixed;inset:0;background:rgba(15,30,70,.55);display:none;place-items:center;z-index:60;padding:20px}
  #mod .box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:380px;max-height:80vh;
    overflow:auto;color:var(--dark)}
  #mod h3{font-size:16px;margin-bottom:6px}
  #mod .sub{font-size:12px;color:#6d7fa6;margin:12px 0 6px;font-weight:bold}
  #mod .row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;
    background:var(--tint2);margin-bottom:6px;font-size:13px}
  #mod .row span{color:#6d7fa6}
  #mod .row b{word-break:break-word;text-align:right}
  #mod .tip{font-size:11px;color:#8a97b5;margin-top:10px;line-height:1.7}
  #mod .ok{margin-top:14px;text-align:center;padding:12px;border-radius:12px;background:var(--blue);
    color:#fff;font-weight:bold;cursor:pointer}
  #mod .ok.alt{background:var(--tint);color:var(--blue);margin-top:8px}
  #mod .urow{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--tint2);
    margin-bottom:6px;font-size:13px}
  #mod .urow .un{flex:1;font-weight:bold;word-break:break-word}
  #mod .urow .ut{font-size:11px;padding:4px 10px;border-radius:10px;background:var(--tint);color:var(--blue);cursor:pointer}
  #mod .urow .ut.e{background:#ffe9b0;color:#7a5b00}
  #mod .urow .ud{cursor:pointer;font-size:15px}
  #mod .code{margin:14px 0 4px;text-align:center;font-size:22px;font-weight:900;letter-spacing:2px;direction:ltr;
    padding:14px 8px;border-radius:12px;background:var(--tint2);color:var(--ink);user-select:all;word-break:break-all}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:rgba(31,58,122,.96);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;
    z-index:70;display:none;max-width:90%;text-align:center;line-height:1.6}

  /* ===== Right-to-left (Persian) ===== */
  html[dir=rtl] .hero::before{right:auto;left:-70px}
  html[dir=rtl] .hero::after{left:auto;right:-50px}
  html[dir=rtl] .b-cam{left:auto;right:8px}
  html[dir=rtl] .b-edit{right:auto;left:8px}
  html[dir=rtl] .b-del{right:auto;left:42px}
  html[dir=rtl] .b-copy{left:auto;right:8px}
  html[dir=rtl] .fdel{left:auto;right:4px}
  html[dir=rtl] #drawer{left:auto;right:0;transform:translateX(100%);border-radius:26px 0 0 26px;
    box-shadow:-10px 0 30px rgba(0,0,0,.2)}
  html[dir=rtl] body.menu-open #drawer{transform:none}
  html[dir=rtl] .spec .v{text-align:left}
  html[dir=rtl] table.rt th.l,html[dir=rtl] table.rt td.l{text-align:right}
  html[dir=rtl] .eqrow .go{transform:scaleX(-1)}
  html[dir=rtl] #mod .row b{text-align:left}
  html[dir=rtl] #lbClose{right:auto;left:14px}
  html[dir=rtl] .mhero .mimg svg{transform:scaleX(-1)}
</style>

  /* ===== Storage usage, permanent storage and big-file protection ===== */
  const fmtBytes = b => b >= 1073741824 ? (b/1073741824).toFixed(1) + " GB"
    : b >= 1048576 ? (b/1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b/1024)) + " KB";
  function lsBytes(){
    let n = 0;
    try{
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        n += (k.length + (localStorage.getItem(k) || "").length) * 2;
      }
    }catch(e){}
    return n;
  }
  async function storageInfo(){

    try{ if (navigator.storage && navigator.storage.persisted) persisted = await navigator.storage.persisted(); }catch(e){}
    return {usage, quota, persisted, ls: lsBytes()};
  }
  async function spaceOK(bytes){
    const s = await storageInfo();

  }

  /* ===== Accounts (login from the ☰ menu) =====

  async function sha(s){
    try{
      const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ws:" + s));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
    }catch(e){ return "p:" + s; }
  }

  }

  /* ===== File storage (IndexedDB) ===== */
  const dbp = new Promise((res,rej)=>{
    const r = indexedDB.open("wsfiles",1);

    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);

    const t = db.transaction("f", mode), q = fn(t.objectStore("f"));
    t.oncomplete = () => res(q && q.result);
    t.onerror = () => rej(t.error);
  }));

  /* totals are calculated live from the motors' technical specs */
  function plantStats(){
    let n = 0, a = 0, kw = 0, full = 0;
    const rec = (list, depth) => list.forEach(x => {
      if (depth === 3){
        n++;
        const A = motorA(x), K = motorKW(x);
        if (A != null) a += A;
        if (K != null) kw += K;
        if (A != null && K != null) full++;
      } else rec(x.children || [], depth + 1);
    });
    rec(tree, 0);
    return {n, a:r2(a), kw:r2(kw), pct: n ? Math.round(full * 100 / n) : 0};
  }
  /* same numbers, but only for one zone (zone → room → panel → motor) */
  function zoneStats(zone){
    let n = 0, a = 0, kw = 0, full = 0;
    const rec = (list, depth) => list.forEach(x => {
      if (depth === 3){
        n++;
        const A = motorA(x), K = motorKW(x);
        if (A != null) a += A;
        if (K != null) kw += K;
        if (A != null && K != null) full++;
      } else rec(x.children || [], depth + 1);
    });
    rec(zone.children || [], 1);
    return {n, a:r2(a), kw:r2(kw), pct: n ? Math.round(full * 100 / n) : 0};
  }

  function searchAll(q){
    const out = [], ql = q.toLowerCase();
    const rec = (list, ids, names, depth) => list.forEach(n => {
      const p = [...ids, n.id], nm = [...names, n.name];
      if (n.name.toLowerCase().includes(ql)) out.push({path:p, names:nm, depth});
      if (out.length < 80) rec(n.children || [], p, nm, depth + 1);
    });
    rec(tree, [], [], 0);
    return out.slice(0, 40);
  }

  function eqIcon(name){
    const n = String(name);
    if (/sensor|temp|سنسور|دما|ترموکوپل|PT100/i.test(n)) return "🌡️";
    if (/contactor|کنتاکتور/i.test(n)) return "🔘";
    if (/relay|overload|رله|اضافه/i.test(n)) return "🛡️";
    if (/bearing|بلبرینگ|یاتاقان/i.test(n)) return "⚙️";
    if (/coupling|کوپلینگ/i.test(n)) return "🔗";
    if (/starter|inverter|drive|استارتر|اینورتر|درایو/i.test(n)) return "🎛️";
